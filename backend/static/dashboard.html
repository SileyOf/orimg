<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script src="/assets/appearance.js?v=0.4.6"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户中心</title>
    <link rel="icon" href="/assets/favicon.svg?v=0.4.6" />
    <link rel="stylesheet" href="/assets/styles.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/album.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/design.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/appearance.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/background.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/account.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/responsive.css?v=0.4.6" />
    <link rel="stylesheet" href="/assets/mail.css?v=0.4.6" />
  </head>
  <body class="dashboard-page ui-v4" data-brand-pending>
    <div class="auth-status" id="authStatus" role="status"><span class="auth-spinner" aria-hidden="true"></span><p id="authStatusText">正在确认登录状态</p><button class="ghost-button compact" id="retrySession" type="button" hidden>重试</button></div>
    <div class="login-shell" id="loginShell" hidden>
      <a class="brand" href="/">
        <img class="brand-logo" src="/assets/logo.svg" alt="" />
        <span>
          <strong data-site-name></strong>
          <small>用户后台</small>
        </span>
      </a>
      <form class="login-form" id="loginForm">
        <label>
          邮箱
          <input name="email" type="email" autocomplete="email" />
        </label>
        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" />
        </label>
        <div class="form-grid captcha-row">
          <label>
            验证
            <input name="captcha_answer" autocomplete="off" />
          </label>
          <div class="captcha-box">
            <strong id="captchaQuestion">...</strong>
            <button class="ghost-button compact" id="refreshCaptcha" type="button">刷新</button>
          </div>
        </div>
        <button class="primary-button" type="submit">登录</button>
      </form>
      <p class="message" id="loginMessage"></p>
      <nav class="auth-links" aria-label="账号服务"><a id="forgotMail" href="/forgot-password" hidden>忘记密码</a><a id="registerLink" href="/register" hidden>创建账号</a></nav>
    </div>

    <div class="dashboard-shell" id="dashboardShell" hidden>
      <header class="topbar dashboard-topbar">
        <a class="brand" href="/">
          <img class="brand-logo" src="/assets/logo.svg" alt="" />
          <span>
            <strong id="dashboardName" data-site-name></strong>
            <small>个人空间</small>
          </span>
        </a>
        <div class="top-actions">
          <a class="ghost-button compact dashboard-upload-link" href="/">上传图片</a>
          <div id="accountSlot"></div>
        </div>
      </header>

      <nav class="dashboard-nav" aria-label="用户后台导航">
        <button class="active" data-page="overview" type="button">仪表盘</button>
        <button data-page="photos" type="button">相册</button>
      </nav>

      <main class="dashboard-stack">
        <section class="admin-panel dashboard-page-panel user-overview" data-page="overview">
          <div class="section-title">
            <div><h2 id="dashboardGreeting">我的空间</h2></div>
            <button class="ghost-button compact" id="reloadUserOverview" type="button">刷新</button>
          </div>
          <p class="message" id="overviewMessage" role="status"></p>
          <div class="user-metrics">
            <article><span>全部图片</span><strong id="userMetricImages">--</strong><small id="userMetricBytes">正在读取</small></article>
            <article><span>今日上传</span><strong id="userMetricToday">--</strong><small id="userMetricTodayBytes">正在读取</small></article>
            <article><span>本地存储</span><strong id="userMetricLocal">--</strong><small>Local</small></article>
            <article><span>云端存储</span><strong id="userMetricCloud">--</strong><small id="userMetricMirror">S3</small></article>
          </div>
          <div class="user-overview-grid">
            <section class="user-activity">
              <div class="compact-heading"><h3>上传动态</h3><span>近 14 天</span></div>
              <div class="activity-chart user-activity-chart" id="userActivityChart"></div>
            </section>

          </div>
          <section class="recent-section"><div class="compact-heading"><h3>最近上传</h3><button class="text-action" id="viewAllPhotos" type="button">查看相册</button></div><div class="recent-images" id="recentImages" aria-live="polite"></div></section>
        </section>

        <section class="admin-panel dashboard-page-panel album-panel" data-page="photos" hidden>
          <div class="section-title">
            <div><h2>我的相册</h2></div>
            <button class="ghost-button compact" id="reloadImages" type="button">刷新</button>
          </div>
          <form class="image-filter-bar" id="imageFilterForm">
            <label class="search-field"><span>搜索</span><input id="imageSearch" placeholder="文件名或图片 ID" /></label>
            <label><span>存储</span><select id="imageStorageFilter"><option value="">全部</option><option value="local">Local</option><option value="s3">S3</option><option value="mirror">Mirror</option></select></label>
            <label><span>从</span><input id="imageFromFilter" type="date" /></label>
            <label><span>到</span><input id="imageToFilter" type="date" /></label>
            <button class="primary-button compact" type="submit">筛选</button>
            <button class="ghost-button compact" id="resetImageFilter" type="button">重置</button>
          </form>
          <div class="image-selection-bar" id="imageSelectionBar" hidden>
            <strong><span id="selectedImageCount">0</span> 张已选择</strong>
            <div>
              <button class="ghost-button compact" id="copySelectedImages" type="button">复制链接</button>
              <button class="danger-button compact" id="deleteSelectedImages" type="button">移至回收站</button>
              <button class="ghost-button compact" id="clearImageSelection" type="button">取消选择</button>
            </div>
          </div>
          <div class="album-grid" id="albumGrid"></div>
		  <button class="ghost-button album-load-more" id="loadMoreImages" type="button" hidden>加载更多</button>
          <p class="message" id="albumMessage" role="status"></p>
        </section>


      </main>
    </div>


        <dialog class="account-dialog" id="accountDialog" aria-labelledby="accountDialogTitle">
          <header class="account-dialog-header"><h2 id="accountDialogTitle">账号设置</h2><button class="icon-button" id="closeAccount" type="button" aria-label="关闭账号设置">×</button></header>
          <div class="account-dialog-body">
          <div class="profile-avatar-editor">
            <div id="profileAvatar" class="user-avatar" aria-label="当前头像"></div>
            <button class="ghost-button compact" id="chooseAvatar" type="button">更换头像</button>
            <button class="ghost-button compact" id="removeAvatar" type="button" hidden>移除</button>
            <input id="avatarFile" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          </div>
          <form id="profileForm" class="settings-form">
            <label>
              用户名
              <input name="username" />
            </label>
            <label>
              登录邮箱
              <input name="email" type="email" autocomplete="email" readonly />
            </label>
            <label>
              当前密码
              <input name="current_password" type="password" autocomplete="current-password" />
            </label>
            <label>
              新密码
              <input name="new_password" type="password" autocomplete="new-password" placeholder="留空则不改密码" />
            </label>
            <button class="primary-button" type="submit">保存账号</button>
          </form>
          <p class="message" id="profileMessage"></p>
          <section id="accountMail" class="account-mail" hidden>
            <div class="section-title"><h3>邮箱验证</h3><button class="ghost-button compact" id="verifyEmail" type="button">发送验证邮件</button></div>
            <p id="emailVerifiedState"></p>
            <details><summary>更换登录邮箱</summary><form id="changeEmailForm">
              <label>新邮箱<input name="email" type="email" required autocomplete="email" /></label>
              <label>当前密码<input name="current_password" type="password" required autocomplete="current-password" /></label>
              <button class="ghost-button" type="submit">验证新邮箱</button>
            </form></details>
            <p id="accountMailMessage" class="message" role="status"></p>
          </section>
          <section class="account-policy-panel" aria-labelledby="accountPolicyTitle">
            <div class="section-title compact-section-title">
              <div><h2 id="accountPolicyTitle">账号权限</h2><p class="inline-help">当前账号的上传限制与空间使用情况。</p></div>
              <span class="soft-badge" id="policyGroup">--</span>
            </div>
            <div class="account-policy-details">
              <div><span>存储策略</span><strong id="overviewStorageMode">--</strong></div>
              <div><span>单图 / 单批</span><strong id="policyLimits">--</strong></div>
              <div class="quota-summary">
                <span>已用空间</span><strong id="policyQuota">--</strong>
                <div><i id="policyQuotaBar"></i></div>
              </div>
            </div>
          </section>
          <section class="api-token-section">
            <div class="section-title">
              <div><h2>API Token</h2><p class="inline-help">用于 PicGo、ShareX 或脚本上传。Token 仅在创建时显示一次。</p></div>
            </div>
            <form class="token-create-form" id="tokenCreateForm">
              <label><span>名称</span><input name="name" maxlength="80" placeholder="例如 MacBook PicGo" /></label>
              <label><span>有效期</span><select name="expires_days"><option value="30">30 天</option><option value="90">90 天</option><option value="365">1 年</option><option value="0">不过期</option></select></label>
              <button class="primary-button compact" type="submit">创建 Token</button>
            </form>
            <div class="token-reveal" id="tokenReveal" hidden>
              <span>请立即保存</span><code id="tokenValue"></code><button class="ghost-button compact" id="copyToken" type="button">复制</button>
            </div>
            <div class="token-list" id="tokenList"></div>
            <p class="message" id="tokenMessage" role="status"></p>
          </section>
          </div>
        </dialog>

    <script src="/assets/album-icons.js?v=0.4.6" defer></script>
    <script src="/assets/background.js?v=0.4.6" defer></script>
    <script src="/assets/branding.js?v=0.4.6" defer></script>
    <script src="/assets/design.js?v=0.4.6" defer></script>
    <script src="/assets/album.js?v=0.4.6" defer></script>
    <script src="/assets/account.js?v=0.4.6" defer></script>
    <script src="/assets/account-mail.js?v=0.4.6" defer></script>
    <script src="/assets/dashboard.js?v=0.4.6" defer></script>
  </body>
</html>
