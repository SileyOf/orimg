services:
  origin:
    depends_on:
      db:
        condition: service_healthy
  db:
    image: public.ecr.aws/docker/library/mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: origin
      MYSQL_USER: origin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a separate MYSQL_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u origin origin -Nse "SELECT 1"']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mysql-data:
