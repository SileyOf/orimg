# New installations. Pin ORIGIN_IMAGE in .env and update with:
#   docker compose pull && docker compose up -d
name: origin
services:
  origin:
    image: ${ORIGIN_IMAGE:-yuki955/orimg:0.6.0}
    pull_policy: missing
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${ORIGIN_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TZ: ${TZ:-Asia/Shanghai}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - origin-data:/app/data
    extra_hosts:
      # Lets the app reach a MySQL server on the Docker host by this name.
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  origin-data:
