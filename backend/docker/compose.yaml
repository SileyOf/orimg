name: origin
services:
  origin:
    image: ${ORIGIN_IMAGE:-origin:0.5.0}
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${ORIGIN_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TZ: ${TZ:-Asia/Shanghai}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - origin-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  origin-data:
